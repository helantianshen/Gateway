name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: go test
        run: make test

      - name: go test -race
        run: make race

      - name: go build
        run: make build
