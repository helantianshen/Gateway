# Gateway Phase 5 可直接运行的示例配置。
# 先分别启动 :18080、:18081、:18082 上的三个 mock-service，再启动 Gateway。
# 同一逻辑 upstream 的三个 endpoint 使用普通 Round Robin；当前不按 weight 加权。
api_version: v1

upstreams:
  - id: mock-service
    endpoints:
      - id: mock-1
        url: http://127.0.0.1:18080
        weight: 100
      - id: mock-2
        url: http://127.0.0.1:18081
        weight: 100
      - id: mock-3
        url: http://127.0.0.1:18082
        weight: 100

routes:
  - id: hello
    method: GET
    path: /hello
    upstream: mock-service

  - id: echo
    method: POST
    path: /echo
    upstream: mock-service

  - id: slow
    method: GET
    path: /slow
    upstream: mock-service

  - id: stream
    method: GET
    path: /stream
    upstream: mock-service

  # 参数路由用于展示 :param 语义；mock-service 未实现该业务端点时会原样返回 404。
  - id: object-detail
    method: GET
    path: /objects/:id
    upstream: mock-service

  # exact Host 胜过下方 any Host 的 /hello，并保留包含端口的原始 Host。
  - id: admin-hello
    host: admin.example.com
    method: GET
    path: /hello
    upstream: mock-service
    preserve_host: true

  # wildcard Host 只匹配单层 label，例如 app.example.com。
  - id: tenant-hello
    host: "*.example.com"
    method: GET
    path: /hello
    upstream: mock-service

  # 任意 Host 的 GET 兜底 catch-all；未知非 GET 请求仍返回 404。
  - id: fallback
    method: GET
    path: /*path
    upstream: mock-service

policies:
  request_timeout: 3s
  # rate 与 burst 在 Phase 5 仅解析和校验；route policy chain 已建立，但尚不执行限流。
  rate: 0
  burst: 0
